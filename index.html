<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>Budget Planner</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --bg:#f4f7fb; --card:#fff; --text:#172033; --muted:#6b7280;
      --border:#e5e7eb; --primary:#4f46e5; --primary-soft:#eef2ff;
      --green:#059669; --red:#dc2626; --yellow:#d97706; --shadow:0 8px 30px rgba(15,23,42,.07);
    }
    [data-theme="dark"] {
      --bg:#0b1120; --card:#111827; --text:#f3f4f6; --muted:#9ca3af;
      --border:#243044; --primary:#818cf8; --primary-soft:#1e1b4b;
      --green:#34d399; --red:#f87171; --yellow:#fbbf24; --shadow:0 8px 30px rgba(0,0,0,.25);
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button,input,select{font:inherit}
    button{cursor:pointer}
    .app{display:flex;min-height:100vh}
    aside{width:245px;background:var(--card);border-right:1px solid var(--border);padding:22px 14px;position:fixed;inset:0 auto 0 0;z-index:10}
    .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;padding:6px 10px 24px}
    .brand i{color:var(--primary)}
    nav button{width:100%;display:flex;align-items:center;gap:12px;padding:12px;border:0;background:transparent;color:var(--muted);border-radius:10px;text-align:left;margin:3px 0}
    nav button:hover,nav button.active{background:var(--primary-soft);color:var(--primary);font-weight:650}
    .bottom-tools{position:absolute;bottom:20px;left:14px;right:14px}
    .theme-btn{width:100%;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:10px;padding:10px;display:flex;gap:10px;align-items:center}
    main{margin-left:245px;width:calc(100% - 245px);padding:28px;max-width:1500px}
    .mobile-head{display:none}
    .site-controls{display:flex;justify-content:flex-end;margin-bottom:12px}
    .global-toggle{display:flex;align-items:center;gap:9px;border:1px solid var(--border);background:var(--card);padding:7px 10px;border-radius:10px;color:var(--text);font-size:13px;cursor:pointer;box-shadow:var(--shadow)}
    .global-toggle>span:first-child{display:flex;align-items:center;gap:6px}
    .global-toggle input{display:none}
    .toggle-track{width:36px;height:20px;border-radius:99px;background:var(--border);padding:2px;transition:.2s}
    .toggle-thumb{display:block;width:16px;height:16px;background:white;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
    .global-toggle input:checked + .toggle-track{background:var(--primary)}
    .global-toggle input:checked + .toggle-track .toggle-thumb{transform:translateX(16px)}
    .quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
    .quick-btn{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:10px;padding:10px;text-align:left}
    .quick-btn strong{display:block;font-size:13px}
    .quick-btn span{font-size:11px;color:var(--muted)}
    .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;gap:15px}
    h1{font-size:28px;margin:0 0 5px}
    .subtitle{color:var(--muted);font-size:14px}
    .month-nav{display:flex;align-items:center;gap:8px}
    .icon-btn,.btn{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:10px;padding:9px 11px;display:inline-flex;align-items:center;gap:8px}
    .btn.primary{background:var(--primary);border-color:var(--primary);color:white}
    .icon-btn:hover,.btn:hover{filter:brightness(.97)}
    .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:19px;box-shadow:var(--shadow)}
    .stat-label{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:8px}
    .stat-value{font-size:25px;font-weight:800;margin-top:9px}
    .positive{color:var(--green)} .negative{color:var(--red)}
    .section-grid{display:grid;grid-template-columns:1.3fr .7fr;gap:15px;margin-top:15px}
    .section-title{font-size:16px;font-weight:750;margin:0 0 16px;display:flex;justify-content:space-between;align-items:center}
    .account-list{display:grid;gap:10px}
    .account{display:flex;align-items:center;justify-content:space-between;padding:12px;border:1px solid var(--border);border-radius:12px}
    .account-left{display:flex;align-items:center;gap:12px}
    .account-icon{width:38px;height:38px;border-radius:10px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center}
    .small{font-size:12px;color:var(--muted)}
    .amount{font-weight:750}
    .chart{height:240px;display:flex;align-items:flex-end;gap:10px;padding:10px 3px 0}
    .bar-wrap{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:7px}
    .bar{width:100%;max-width:42px;border-radius:7px 7px 2px 2px;background:var(--primary);min-height:4px}
    .bar.out{background:var(--red)}
    .bar-label{font-size:10px;color:var(--muted)}
    .transactions{margin-top:15px}
    .table{width:100%;border-collapse:collapse}
    .table th,.table td{padding:13px 8px;border-bottom:1px solid var(--border);text-align:left;font-size:13px}
    .table th{color:var(--muted);font-weight:600}
    .badge{display:inline-flex;padding:4px 8px;border-radius:999px;background:var(--primary-soft);color:var(--primary);font-size:11px}
    .actions{display:flex;gap:5px}
    .actions button{border:0;background:transparent;color:var(--muted);padding:5px}
    .view{display:none}.view.active{display:block}
    .form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
    .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
    .field input,.field select{width:100%;padding:11px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--text);outline:none}
    .field input:focus,.field select:focus{border-color:var(--primary)}
    .form-actions{margin-top:15px;display:flex;gap:8px}
    .empty{text-align:center;color:var(--muted);padding:28px 10px}
    .goal{border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px}
    .goal-top{display:flex;justify-content:space-between;gap:10px}
    .progress{height:8px;background:var(--border);border-radius:99px;overflow:hidden;margin-top:12px}
    .progress>div{height:100%;background:var(--primary);border-radius:99px}
    .toggle{display:flex;gap:8px;margin-bottom:15px}
    .toggle button{flex:1;padding:10px;border:1px solid var(--border);background:var(--card);color:var(--muted);border-radius:10px}
    .toggle button.active{background:var(--primary-soft);color:var(--primary);border-color:var(--primary)}
    .notice{padding:12px;border-radius:10px;background:var(--primary-soft);color:var(--text);font-size:13px;margin-bottom:15px}
    .danger{color:var(--red)!important}
    @media(max-width:950px){.cards{grid-template-columns:repeat(2,1fr)}.section-grid{grid-template-columns:1fr}}
    @media(max-width:700px){
      aside{display:none}.app{display:block}main{margin:0;width:100%;padding:16px 14px 85px}
      .mobile-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
      .mobile-head .brand{padding:0;font-size:18px}
      .topbar{display:block}.topbar h1{font-size:23px}.month-nav{margin-top:12px}
      .cards{grid-template-columns:1fr 1fr;gap:10px}.card{padding:14px;border-radius:13px}.stat-value{font-size:19px}
      .quick-grid{grid-template-columns:1fr 1fr}
      .table-wrap{overflow-x:auto}.table{min-width:650px}
      .bottom-nav{position:fixed;display:grid;grid-template-columns:repeat(5,1fr);bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);z-index:20;padding:7px 4px}
      .bottom-nav button{border:0;background:transparent;color:var(--muted);font-size:10px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px}
      .bottom-nav button.active{color:var(--primary)}
    }
    @media(min-width:701px){.bottom-nav{display:none}}
  </style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><i data-lucide="wallet"></i>Budget Planner</div>
    <nav id="sideNav">
      <button data-view="dashboard" class="active"><i data-lucide="layout-dashboard"></i>Dashboard</button>
      <button data-view="transactions"><i data-lucide="arrow-left-right"></i>Transacties</button>
      <button data-view="accounts"><i data-lucide="landmark"></i>Rekeningen</button>
      <button data-view="crypto"><i data-lucide="bitcoin"></i>Crypto</button>
      <button data-view="budgets"><i data-lucide="pie-chart"></i>Budgetten</button>
      <button data-view="goals"><i data-lucide="target"></i>Spaardoelen</button>
      <button data-view="recurring"><i data-lucide="repeat"></i>Terugkerend</button>
    </nav>
    <div class="bottom-tools"><button class="theme-btn" id="themeBtn"><i data-lucide="moon"></i><span>Licht/donker</span></button></div>
  </aside>

  <main>
    <div class="mobile-head">
      <div class="brand"><i data-lucide="wallet"></i>Budget Planner</div>
      <button class="icon-btn" id="mobileTheme"><i data-lucide="moon"></i></button>
    </div>

    <div class="site-controls">
      <label class="global-toggle">
        <span><i data-lucide="bitcoin"></i> Crypto</span>
        <input type="checkbox" id="globalCryptoToggle" ${data.cryptoEnabled?"checked":""}>
        <span class="toggle-track"><span class="toggle-thumb"></span></span>
      </label>
    </div>

    <section id="dashboard" class="view active"></section>
    <section id="transactions" class="view"></section>
    <section id="accounts" class="view"></section>
    <section id="crypto" class="view"></section>
    <section id="budgets" class="view"></section>
    <section id="goals" class="view"></section>
    <section id="recurring" class="view"></section>
  </main>
</div>

<div class="bottom-nav" id="bottomNav">
  <button data-view="dashboard" class="active"><i data-lucide="layout-dashboard"></i>Home</button>
  <button data-view="transactions"><i data-lucide="arrow-left-right"></i>Transacties</button>
  <button data-view="accounts"><i data-lucide="landmark"></i>Rekeningen</button>
  <button data-view="crypto"><i data-lucide="bitcoin"></i>Crypto</button>
  <button data-view="goals"><i data-lucide="target"></i>Doelen</button>
</div>

<script>
const STORAGE_KEY = "budgetPlannerV1";
const defaultData = {
  theme:"light",
  cryptoEnabled:true,
  accounts:[
    {id:"acc1",name:"ABN Betaalrekening",type:"betaal",balance:0,icon:"wallet"},
    {id:"acc2",name:"ABN Spaarrekening",type:"spaar",balance:0,icon:"piggy-bank"},
    {id:"acc3",name:"Revolut Betaalrekening",type:"revolut-betaal",balance:0,icon:"credit-card"},
    {id:"acc4",name:"Revolut Spaarrekening",type:"revolut-spaar",balance:0,icon:"landmark"}
  ],
  crypto:0,
  transactions:[],
  budgets:[],
  goals:[],
  recurring:[]
};
let data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null") || structuredClone(defaultData);
let currentMonth = new Date();
currentMonth.setDate(1);
let activeView="dashboard";
if(typeof data.cryptoEnabled!=="boolean") data.cryptoEnabled=true;
if(data.accounts){
  const renameMap={"Betaalrekening":"ABN Betaalrekening","Spaarrekening":"ABN Spaarrekening"};
  data.accounts.forEach(a=>{if(renameMap[a.name])a.name=renameMap[a.name]});
  localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
}

const euro = n => new Intl.NumberFormat("nl-NL",{style:"currency",currency:"EUR"}).format(Number(n)||0);
const id = () => Math.random().toString(36).slice(2)+Date.now();
const save = () => { localStorage.setItem(STORAGE_KEY,JSON.stringify(data)); render(); };
const monthKey = d => {
  const x=new Date(d); return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}`;
};
const currentKey = () => monthKey(currentMonth);
const monthName = () => currentMonth.toLocaleDateString("nl-NL",{month:"long",year:"numeric"});
const monthTransactions = () => data.transactions.filter(t=>monthKey(t.date)===currentKey());

function processRecurringTransactions(){
  if(!Array.isArray(data.recurring) || !data.recurring.length) return;
  const today=new Date();
  const targetMonth=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,"0")}`;
  let changed=false;
  data.recurring.forEach(r=>{
    const marker=`${targetMonth}-${r.id}`;
    if(data.transactions.some(t=>t.recurringId===marker)) return;
    const day=Math.min(Number(r.day)||1,28);
    const date=`${targetMonth}-${String(day).padStart(2,"0")}`;
    const acc=data.accounts.find(a=>a.id===r.accountId);
    if(!acc) return;
    if(r.kind==="expense" && acc.balance < Number(r.amount)) return;
    const amount=Number(r.amount)||0;
    acc.balance += r.kind==="income" ? amount : -amount;
    data.transactions.push({
      id:id(),
      recurringId:marker,
      description:r.description,
      amount,
      date,
      category:r.category,
      accountId:r.accountId,
      kind:r.kind
    });
    changed=true;
  });
  if(changed) localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
}
function render(){
  processRecurringTransactions();
  document.documentElement.dataset.theme=data.theme==="dark"?"dark":"light";
  renderDashboard(); renderTransactions(); renderAccounts(); renderCrypto(); renderBudgets(); renderGoals(); renderRecurring();
  setActiveView(activeView); lucide.createIcons();
}
function setActiveView(view){
  if(view==="crypto" && !data.cryptoEnabled) view="dashboard";
  activeView=view;
  document.querySelectorAll(".view").forEach(v=>v.classList.toggle("active",v.id===view));
  document.querySelectorAll("[data-view]").forEach(b=>{
    const isCrypto=b.dataset.view==="crypto";
    b.style.display=isCrypto && !data.cryptoEnabled?"none":"";
    b.classList.toggle("active",b.dataset.view===view);
  });
}
function navEvents(){
  document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>setActiveView(b.dataset.view));
}
function themeToggle(){
  data.theme=data.theme==="dark"?"light":"dark"; save();
}
document.getElementById("themeBtn").onclick=themeToggle;
document.getElementById("mobileTheme").onclick=themeToggle;
document.getElementById("globalCryptoToggle").onchange=(e)=>{
  data.cryptoEnabled=e.target.checked;
  save();
  setActiveView(e.target.checked ? activeView : (activeView==="crypto"?"dashboard":activeView));
};

function renderDashboard(){
  const ts=monthTransactions();
  const income=ts.filter(t=>t.kind==="income").reduce((a,t)=>a+Number(t.amount),0);
  const expenses=ts.filter(t=>t.kind==="expense").reduce((a,t)=>a+Number(t.amount),0);
  const cash=data.accounts.reduce((a,x)=>a+Number(x.balance),0);
  const total=cash;
  const net=income-expenses;
  const days=["Ma","Di","Wo","Do","Vr","Za","Zo"];
  const week=days.map((_,i)=>({income:0,expense:0,label:days[i]}));
  ts.forEach(t=>{const d=new Date(t.date).getDay(); const idx=(d+6)%7; week[idx][t.kind==="income"?"income":"expense"]+=Number(t.amount)});
  const max=Math.max(1,...week.flatMap(x=>[x.income,x.expense]));
  const recent=[...ts].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,6);
  document.getElementById("dashboard").innerHTML=`
    <div class="topbar">
      <div><h1>Dashboard</h1><div class="subtitle">Je financiële overzicht</div></div>
      <div class="month-nav">
        <button class="icon-btn" id="prevMonth"><i data-lucide="chevron-left"></i></button>
        <strong style="min-width:145px;text-align:center;text-transform:capitalize">${monthName()}</strong>
        <button class="icon-btn" id="nextMonth"><i data-lucide="chevron-right"></i></button>
      </div>
    </div>
    <div class="cards">
      <div class="card"><div class="stat-label"><i data-lucide="wallet"></i>Beschikbaar geld</div><div class="stat-value">${euro(cash)}</div></div>
      <div class="card"><div class="stat-label"><i data-lucide="landmark"></i>Totaal vermogen</div><div class="stat-value">${euro(total)}</div></div>
      <div class="card"><div class="stat-label"><i data-lucide="${net>=0?"trending-up":"trending-down"}"></i>Deze maand</div><div class="stat-value ${net>=0?"positive":"negative"}">${euro(net)}</div></div>
    </div>
    <div class="section-grid">
      <div class="card"><div class="section-title">Inkomsten & uitgaven</div>
        <div class="chart">${week.map(x=>`<div class="bar-wrap"><div style="height:${Math.max(4,x.income/max*150)}px;width:45%;display:flex;align-items:flex-end"><div class="bar" style="height:100%;width:100%"></div></div><div style="height:${Math.max(4,x.expense/max*150)}px;width:45%;display:flex;align-items:flex-end"><div class="bar out" style="height:100%;width:100%"></div></div><div class="bar-label">${x.label}</div></div>`).join("")}</div>
        <div class="small" style="margin-top:8px"><span class="positive">● Inkomsten</span> &nbsp; <span class="negative">● Uitgaven</span></div>
      </div>
      <div class="card"><div class="section-title">Vermogen <span class="small">Alleen bankrekeningen</span></div>
        <div class="account-list">${data.accounts.map(a=>`<div class="account"><div class="account-left"><div class="account-icon"><i data-lucide="${a.icon}"></i></div><div>${a.name}</div></div><div class="amount">${euro(a.balance)}</div></div>`).join("")}</div>
      </div>
    </div>
    <div class="card transactions"><div class="section-title">Recente transacties <button class="btn primary" id="quickAdd"><i data-lucide="plus"></i>Toevoegen</button></div>
      ${recent.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Omschrijving</th><th>Categorie</th><th>Datum</th><th>Bedrag</th></tr></thead><tbody>${recent.map(t=>`<tr><td>${esc(t.description)}</td><td><span class="badge">${esc(t.category)}</span></td><td>${formatDate(t.date)}</td><td class="${t.kind==="income"?"positive":t.kind==="transfer"?"":"negative"}">${t.kind==="income"?"+":t.kind==="transfer"?"↔":"-"}${euro(t.amount)}</td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">Nog geen transacties in deze maand.</div>`}
    </div>`;
  document.getElementById("prevMonth").onclick=()=>{currentMonth.setMonth(currentMonth.getMonth()-1);render()};
  document.getElementById("nextMonth").onclick=()=>{currentMonth.setMonth(currentMonth.getMonth()+1);render()};
  document.getElementById("quickAdd").onclick=()=>{setActiveView("transactions");setTimeout(()=>document.getElementById("description")?.focus(),0)};
  const cryptoToggle=document.getElementById("showCryptoDashboard");
  const cryptoBox=document.getElementById("dashboardCrypto");
  cryptoToggle.onchange=()=>{
    cryptoBox.innerHTML=cryptoToggle.checked
      ? `<div style="display:flex;justify-content:space-between;align-items:center"><span>Crypto-inleg</span><strong>${euro(data.crypto)}</strong></div><div class="small" style="margin-top:6px">Dit bedrag staat los van je totaal bankvermogen.</div>`
      : `Crypto is apart van je bankvermogen en wordt niet meegenomen in totaal vermogen.`;
  };
}

function renderTransactions(){
  const ts=[...monthTransactions()].sort((a,b)=>new Date(b.date)-new Date(a.date));
  document.getElementById("transactions").innerHTML=`
    <div class="topbar"><div><h1>Transacties</h1><div class="subtitle">Inkomsten en uitgaven van ${monthName()}</div></div></div>
    <div class="card">
      <div class="section-title">Snelle uitgave <span class="small">1 klik = direct toegevoegd</span></div>
      <div class="quick-grid">
        ${quickExpenses.map(q=>`<button class="quick-btn" data-quick="${q.name}" data-amount="${q.amount}" data-category="${q.category}"><strong>${esc(q.name)}</strong><span>${euro(q.amount)} · ${esc(q.category)}</span></button>`).join("")}
      </div>
    </div>

    <div class="card" style="margin-top:15px">
      <div class="section-title">Nieuwe transactie</div>
      <form id="transactionForm">
        <div class="toggle"><button type="button" data-kind="expense" class="active">Uitgave</button><button type="button" data-kind="income">Inkomst</button><button type="button" data-kind="transfer">Overboeking</button></div>
        <div class="form-grid">
          <div class="field"><label>Omschrijving</label><input id="description" required placeholder="Bijv. Boodschappen"></div>
          <div class="field"><label>Bedrag (€)</label><input id="amount" required type="number" min="0" step="0.01" placeholder="0,00"></div>
          <div class="field"><label>Datum</label><input id="date" type="date" value="${new Date().toISOString().slice(0,10)}" required></div>
          <div class="field"><label>Categorie</label><select id="category">${categories.map(c=>`<option>${c}</option>`).join("")}</select></div>
          <div class="field"><label id="accountLabel">Rekening</label><select id="account">${data.accounts.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join("")}</select></div>
          <div class="field" id="transferField" style="display:none"><label>Geld naar</label><select id="transferTo">${data.accounts.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join("")}</select></div>
        </div>
        <div class="form-actions"><button class="btn primary" type="submit"><i data-lucide="plus"></i>Transactie toevoegen</button></div>
      </form>
    </div>
    <div class="card transactions"><div class="section-title">Transacties</div>
      ${ts.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Omschrijving</th><th>Categorie</th><th>Datum</th><th>Rekening</th><th>Bedrag</th><th></th></tr></thead><tbody>${ts.map(t=>`<tr><td>${esc(t.description)}</td><td><span class="badge">${esc(t.category)}</span></td><td>${formatDate(t.date)}</td><td>${esc(data.accounts.find(a=>a.id===t.accountId)?.name||"-")}</td><td class="${t.kind==="income"?"positive":t.kind==="transfer"?"":"negative"}">${t.kind==="income"?"+":t.kind==="transfer"?"↔":"-"}${euro(t.amount)}</td><td><div class="actions"><button onclick="editTransaction('${t.id}')" title="Bewerken"><i data-lucide="pencil"></i></button><button onclick="deleteTransaction('${t.id}')" class="danger" title="Verwijderen"><i data-lucide="trash-2"></i></button></div></td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">Nog geen transacties.</div>`}
    </div>`;
  let kind="expense";
  const transferField=document.getElementById("transferField");
  const categoryField=document.getElementById("category").parentElement;
  const accountLabel=document.getElementById("accountLabel");
  document.querySelectorAll("#transactionForm .toggle button").forEach(b=>b.onclick=()=>{
    kind=b.dataset.kind;
    document.querySelectorAll("#transactionForm .toggle button").forEach(x=>x.classList.toggle("active",x===b));
    const isTransfer=kind==="transfer";
    transferField.style.display=isTransfer?"block":"none";
    categoryField.style.display=isTransfer?"none":"block";
    accountLabel.textContent=isTransfer?"Van rekening":"Rekening";
  });
  document.getElementById("transactionForm").onsubmit=e=>{
    e.preventDefault();
    const amountValue=Number(amount.value);
    if(!amountValue || amountValue<0)return;
    if(kind==="transfer"){
      const from=data.accounts.find(a=>a.id===account.value);
      const to=data.accounts.find(a=>a.id===transferTo.value);
      if(!from||!to||from.id===to.id){alert("Kies twee verschillende rekeningen.");return}
      if(from.balance < amountValue){alert("Onvoldoende saldo op de bronrekening.");return}
      from.balance-=amountValue;
      to.balance+=amountValue;
      data.transactions.push({
        id:id(),description:description.value||"Overboeking",amount:amountValue,date:date.value,
        category:"Overboeking",accountId:from.id,toAccountId:to.id,kind:"transfer"
      });
    } else {
      const t={id:id(),description:description.value,amount:amountValue,date:date.value,category:category.value,accountId:account.value,kind};
      const acc=data.accounts.find(a=>a.id===t.accountId);
      if(acc) acc.balance += kind==="income"?t.amount:-t.amount;
      data.transactions.push(t);
    }
    save();
  };
  document.querySelectorAll(".quick-btn").forEach(btn=>btn.onclick=()=>{
    const acc=data.accounts.find(a=>a.id===document.getElementById("account").value);
    const amountValue=Number(btn.dataset.amount);
    if(!acc || acc.balance < amountValue){alert("Onvoldoende saldo op deze rekening.");return}
    acc.balance-=amountValue;
    data.transactions.push({
      id:id(),description:btn.dataset.quick,amount:amountValue,
      date:new Date().toISOString().slice(0,10),category:btn.dataset.category,
      accountId:acc.id,kind:"expense"
    });
    save();
  });
}

function editTransaction(tid){
  const t=data.transactions.find(x=>x.id===tid); if(!t)return;
  const newAmount=prompt("Bedrag (€):",t.amount); if(newAmount===null)return;
  const n=Number(newAmount); if(isNaN(n)||n<0)return;
  if(t.kind==="transfer"){
    const from=data.accounts.find(a=>a.id===t.accountId);
    const to=data.accounts.find(a=>a.id===t.toAccountId);
    if(from) from.balance+=t.amount;
    if(to) to.balance-=t.amount;
    if(!from||!to||from.balance<n){alert("Onvoldoende saldo voor deze wijziging.");if(from)from.balance-=t.amount;if(to)to.balance+=t.amount;return}
    from.balance-=n; to.balance+=n;
  } else {
    const acc=data.accounts.find(a=>a.id===t.accountId);
    if(acc) acc.balance += t.kind==="income"?-t.amount:t.amount;
    t.amount=n;
    if(acc) acc.balance += t.kind==="income"?t.amount:-t.amount;
  }
  t.amount=n; save();
}
function deleteTransaction(tid){
  const t=data.transactions.find(x=>x.id===tid); if(!t)return;
  if(!confirm("Deze transactie verwijderen?"))return;
  if(t.kind==="transfer"){
    const from=data.accounts.find(a=>a.id===t.accountId);
    const to=data.accounts.find(a=>a.id===t.toAccountId);
    if(from) from.balance+=t.amount;
    if(to) to.balance-=t.amount;
  } else {
    const acc=data.accounts.find(a=>a.id===t.accountId);
    if(acc) acc.balance += t.kind==="income"?-t.amount:t.amount;
  }
  data.transactions=data.transactions.filter(x=>x.id!==tid);save();
}
function deleteBudget(i){if(confirm("Budget verwijderen?")){data.budgets.splice(i,1);save()}}
function deleteGoal(i){if(confirm("Spaardoel verwijderen?")){data.goals.splice(i,1);save()}}
function deleteRecurring(i){if(confirm("Terugkerende transactie verwijderen?")){data.recurring.splice(i,1);save()}}
function formatDate(d){return new Date(d).toLocaleDateString("nl-NL")}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}

navEvents(); render();
